name: Mirror Upstream Main

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: mirror-upstream-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force-sync fork main with upstream main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/finchvox/finchvox.git
          else
            git remote add upstream https://github.com/finchvox/finchvox.git
          fi

          git fetch --no-tags upstream main
          git fetch --no-tags origin main

          upstream_ref="refs/remotes/upstream/main"
          origin_ref="refs/remotes/origin/main"
          upstream_sha="$(git rev-parse "${upstream_ref}")"
          origin_sha="$(git rev-parse "${origin_ref}")"

          echo "upstream main: ${upstream_sha}"
          echo "fork main:     ${origin_sha}"

          if [ "${upstream_sha}" = "${origin_sha}" ]; then
            echo "Fork main already matches upstream main."
            exit 0
          fi

          git push --force origin "${upstream_ref}:refs/heads/main"
          echo "Fork main was force-synced to upstream main."
