services:
  finchvox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finchvox
    ports:
      - "4317:4317"
      - "3000:3000"
    volumes:
      - ./finchvox_data:/root/.finchvox
    restart: unless-stopped
    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
